# Perfil de Laminación para Prusa i3 Inclusiva (Boquilla 0.8 mm / PLA / Cama Fría)
# Sistema Braille Inclusivo — Hardware / Marlin 1.1.x

# Configuración de Impresora
gcode_flavor = reprap
nozzle_diameter = 0.8
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 20
extrusion_multiplier = 1.0
use_relative_e_distances = 1
use_volumetric_e = 0

# Alturas de Capa
layer_height = 0.4
first_layer_height = 0.4
perimeters = 2
top_solid_layers = 3
bottom_solid_layers = 3

# Temperaturas (PLA / Cama Fría con Adhesivo)
temperature = 210
first_layer_temperature = 210
bed_temperature = 0
first_layer_bed_temperature = 0

# Relleno
fill_density = 20%
fill_pattern = grid
infill_every_layers = 1

# Retracción (Extrusor MK8 Directo)
retract_length = 1.5
retract_speed = 40
retract_lift = 0.4
retract_before_travel = 2
retract_layer_change = 1

# Velocidades (mm/s)
travel_speed = 90
first_layer_speed = 20
perimeter_speed = 35
small_perimeter_speed = 25
external_perimeter_speed = 30
infill_speed = 40
solid_infill_speed = 35
top_solid_infill_speed = 30

# Secuencia de Inicio y Fin de G-Code
start_gcode = G21 ; milimetros\nG90 ; posicionamiento absoluto\nM83 ; extrusion relativa\nG28 ; home de todos los ejes\nG1 Z5 F3000 ; elevar boquilla\nM104 S210 ; calentar extrusor\nM109 S210 ; esperar temperatura\nG1 X5 Y5 Z0.4 F3000 ; ir a posicion de purga\nG92 E0\nG1 X60 E8 F1000 ; linea de purga\nG92 E0

end_gcode = M104 S0 ; apagar extrusor\nM140 S0 ; apagar cama\nG91 ; posicionamiento relativo\nG1 Z10 F2000 ; elevar Z\nG90 ; posicionamiento absoluto\nG28 X0 ; home X\nM84 ; desactivar motores
