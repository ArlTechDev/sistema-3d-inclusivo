<svg width="1210" height="667" viewBox="0 0 1210 667" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><marker refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto-start-reverse" viewBox="0 0 10 10" id="arrow" overflow="hidden"><path d="M0 0 10 5 0 10Z"/></marker></defs><rect x="0" y="0" width="1210" height="667" fill="#FFFFFF"/><path d="M605 249 605 209 170 209 170 175" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M605 249 605 209 460 209 460 175" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M605 249 605 209 750 209 750 175" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M605 249 605 209 1040 209 1040 175" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M170 519 170 479 605 479 605 433" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M460 519 460 479 605 479 605 433" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M750 519 750 479 605 479 605 433" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M1040 519 1040 479 605 479 605 433" stroke="#000000" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="40" y="30" rx="3" width="260" height="139" stroke="#000000" stroke-width="2" fill="#FCF0E1"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="170" y="63.38">Efecto 1:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="84.38">Dificultad para comprender</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="105.38">conceptos espaciales en</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="126.38">Geografía, Geometría y</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="147.38">Matemáticas.</text><rect x="330" y="30" rx="3" width="260" height="139" stroke="#000000" stroke-width="2" fill="#FCF0E1"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="460" y="63.38">Efecto 2:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="84.38">Exclusión educativa y</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="105.38">dependencia de terceros para la</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="126.38">adaptación manual de</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="147.38">materiales.</text><rect x="620" y="30" rx="3" width="260" height="139" stroke="#000000" stroke-width="2" fill="#FCF0E1"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="750" y="84.38">Efecto 3:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="750" y="105.38">Pérdida constante de material</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="750" y="126.38">didáctico por desgaste del papel.</text><rect x="910" y="30" rx="3" width="260" height="139" stroke="#000000" stroke-width="2" fill="#FCF0E1"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="1040" y="73.88">Efecto 4:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="1040" y="94.88">Exclusión educativa y menor</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="1040" y="115.88">autonomía del estudiante frente a</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="1040" y="136.88">sus pares videntes.</text><rect x="40" y="519" rx="3" width="260" height="118" stroke="#000000" stroke-width="2" fill="#E6F5E9"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="170" y="552.38">Causa 1:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="573.38">Alto costo de impresoras 3D y</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="594.38">equipos comerciales, que supera</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="170" y="615.38">el presupuesto escolar.</text><rect x="330" y="519" rx="3" width="260" height="118" stroke="#000000" stroke-width="2" fill="#E6F5E9"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="460" y="552.38">Causa 2:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="573.38">Rápido deterioro del material</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="594.38">táctil tradicional (papel/cartón),</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="460" y="615.38">que pierde relieve al tacto.</text><rect x="620" y="519" rx="3" width="260" height="118" stroke="#000000" stroke-width="2" fill="#E6F5E9"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="750" y="552.38">Causa 3:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="750" y="573.38">Carencia de plataformas locales</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="750" y="594.38">que integren traducción a Braille</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="750" y="615.38">con catálogos de modelos 3D.</text><rect x="910" y="519" rx="3" width="260" height="118" stroke="#000000" stroke-width="2" fill="#E6F5E9"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="15" text-anchor="middle" x="1040" y="552.38">Causa 4:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="1040" y="573.38">Desaprovechamiento de basura</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="1040" y="594.38">tecnológica (e-waste) apta para</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="15" text-anchor="middle" x="1040" y="615.38">construir equipos de bajo costo.</text><rect x="445" y="249" rx="3" width="320" height="190" stroke="#000000" stroke-width="3" fill="#FAE6E6"/><text font-family="Arial,Liberation Sans,Arial" font-weight="700" font-size="17" text-anchor="middle" x="605" y="288.5">PROBLEMA CENTRAL:</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="16" text-anchor="middle" x="605" y="313.5">Limitado acceso a recursos educativos</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="16" text-anchor="middle" x="605" y="338.5">tridimensionales táctiles duraderos para</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="16" text-anchor="middle" x="605" y="363.5">estudiantes con discapacidad visual en</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="16" text-anchor="middle" x="605" y="388.5">instituciones de educación especial del</text><text font-family="Arial,Liberation Sans,Arial" font-weight="400" font-size="16" text-anchor="middle" x="605" y="413.5">municipio de Cochabamba.</text></svg>